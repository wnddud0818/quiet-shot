name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26: Xcode 26.x (iOS 26 SDK) / xcode-27: Xcode 27 (iOS 27 SDK)
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project QuietShot.xcodeproj \
            -scheme QuietShot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
