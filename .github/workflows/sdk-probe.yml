name: SDK API probe (temporary)
on:
  push:
    branches: [claude/sharp-babbage-fbtvjl]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Print SwiftUI Duo API signatures
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE" >/dev/null
          F="$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks"
          CORE="$F/SwiftUICore.framework/Modules/SwiftUICore.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "######## ReservedRegion struct"; sed -n '4850,4912p' "$CORE" | grep -v '^\s*$' | cut -c1-200
          echo "######## reservedRegions owners"; sed -n '10325,10370p' "$CORE" | grep -E "extension|reservedRegions|available" | cut -c1-200
          echo "######## files mentioning CameraCaptureAccessory / onHingeChange"
          FILES=$(find "$F" -name "arm64e-apple-ios.swiftinterface" 2>/dev/null)
          grep -l -E "CameraCaptureAccessory|onHingeChange|func sceneAccessory" $FILES
          for f in $(grep -l -E "CameraCaptureAccessory|onHingeChange|func sceneAccessory" $FILES); do
            echo "--- $f"
            grep -n -B2 -A3 -E "struct CameraCaptureAccessory|public init\(.*isEnabled|func onAvailabilityChange|func onHingeChange|func sceneAccessory|struct HingeContext|struct Hinge |struct Hinge:|enum Status|var hinge|var status|var angle" "$f" | grep -v "^--$" | cut -c1-230 | head -80
          done
