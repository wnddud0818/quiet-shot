name: SDK API probe (temporary)
on:
  push:
    branches: [claude/sharp-babbage-fbtvjl]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Print selected iOS SDK headers
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE" >/dev/null
          F="$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks"
          show() { echo "######## $1 [$2]"; sed -n "$2p" "$F/$1" | grep -v '^\s*$' | cut -c1-200; }
          show AVKit.framework/Headers/AVCaptureDeviceDirectionCoordinator.h 1,200
          show AVKit.framework/Headers/AVCaptureEventInteraction.h 60,140
          show AVKit.framework/Headers/AVCaptureEvent.h 1,80
          show UIKit.framework/Headers/UIHinge.h 1,75
          show UIKit.framework/Headers/UIHingeInteraction.h 1,75
          show AVFoundation.framework/Headers/AVCaptureSession.h 705,760
          show AVFoundation.framework/Headers/AVCaptureSystemZoomSlider.h 20,60
          show AVFoundation.framework/Headers/AVCaptureDevice.h 2125,2142
          show AVFoundation.framework/Headers/AVCaptureDevice.h 2865,2890
          echo "######## AVCaptureAspectRatio constants"
          grep -rn "AVCaptureAspectRatio" "$F/AVFoundation.framework/Headers" | grep -E "const|typedef" | cut -c1-200 | head -12
